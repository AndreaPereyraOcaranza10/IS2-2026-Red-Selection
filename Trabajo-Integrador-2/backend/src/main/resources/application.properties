spring.application.name=dulcemayor-backend
server.port=${SERVER_PORT:8080}

# Development runs out of the box with a persistent local H2 database.
# Set DB_URL, DB_USERNAME and DB_PASSWORD to use MySQL in a shared environment.
spring.datasource.url=${DB_URL:jdbc:h2:file:../data/dulce-mayor;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
