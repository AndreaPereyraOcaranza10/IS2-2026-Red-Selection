<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Busqueda</title>
</head>
<body>
    <nav th:replace="components/navbar :: nav_bar"></nav>
    <div class="container">
        <div class="row mt-5" th:if="${videojuegos.size}">
            <div class="col-12">
                <h2>Resultados "<span th:text="${resultado}"></span>": </h2>
            </div>
            <th:block th:each="videojuego : ${videojuegos}">
                <div th:replace="~{components/card :: videojuego_card(videojuego=${videojuego})}"></div>
            </th:block>
        </div>
        <div class="row mt-5" th:unless="${videojuegos.size}">
            <div class="col-12">
                <h2>No hay resultados de "<span th:text="${resultado}"></span>"</h2>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
