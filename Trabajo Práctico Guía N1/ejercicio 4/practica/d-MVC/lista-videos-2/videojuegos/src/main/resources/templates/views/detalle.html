<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Detalle videojuego</title>
</head>
<body>
    <nav th:replace="components/navbar :: nav_bar"></nav>

    <div class="container">
        <div class="row mt-5" th:object="${videojuego}">
            <div class="col-4">
                <img th:src="${#strings.startsWith(videojuego.imagen, 'http')} ? ${videojuego.imagen} : @{'/imagenes/' + ${videojuego.imagen}}" alt="" class="img-fluid rounded">
            </div>
            <div class="col-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fs-3" th:text="*{titulo}">Card title</h5>
                        <p class="card-text fs-4 text-success fw-bold">$<span th:text="*{precio}">1</span></p>
                        <p class="card-text" th:if="*{stock}">
                            <span class="badge bg-secondary">Stock: <span th:text="*{stock}"></span></span>
                        </p>
                        <p class="card-text" th:unless="*{stock}">
                            <span class="badge bg-danger">No hay stock</span>
                        </p>
                    </div>
                    <hr class="m-0">
                    <div class="card-body">
                        <p class="card-text" th:text="*{descripcion}"></p>
                    </div>
                </div>
            </div>
            <div class="col-12 mt-5">
                <a th:href="@{/inicio}" class="btn btn-outline-dark">Volver</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
