<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{components/layout :: head('Inicio - RedSelection')}"></head>

<body class="sb-nav-fixed">

    <nav th:replace="~{components/topnav :: topnav}"></nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav th:replace="~{components/sidenav :: sidenav}"></nav>
        </div>
        <div id="layoutSidenav_content">
            <main>

                <div class="container mt-5">
                    <div class="row">
                        <th:block th:each="videojuego : ${videojuegos}">
                            <div th:replace="~{components/card :: videojuego_card(videojuego=${videojuego})}"></div>
                        </th:block>
                    </div>
                </div>

            </main>
            <footer th:replace="~{components/footer :: footer}"></footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/scripts.js}"></script>

</body>

</html>
