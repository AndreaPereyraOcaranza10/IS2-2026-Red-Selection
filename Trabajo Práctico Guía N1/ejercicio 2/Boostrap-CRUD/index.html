<!doctype html>
<html lang="es">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <!-- Boostrap Icons--> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    
    <title>CRUD operations</title>
    <link rel="stylesheet" href = "style.css">

  </head>
  <body>
    
    <section class= "p-3">
        
        <div class="row">
            
            <div class="col-12">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userForm">
                    Nuevo usuario <i class="bi bi-person-add"></i>
                </button>
            </div>
    
        </div>

        <div class="row">
            
            <div class="col-12">
                <table class="table table-striped table-hover mt-3 table-center table-bordered">

                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Ciudad</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Trabajo</th>
                            <th>Fecha de inicio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id = "data"></tbody>

                </table>
            </div>
    
        </div>
    
    </section>
    
    <div class="modal fade" id="userForm">

        <div class="modal-dialog modal-dialog-centered modal-lg">

            <div class="modal-content">
                
                <div class="modal-header">
                    <h4 class="modal-title">Completa el formulario</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                
                <div class="modal-body">
                    
                    <form action="#" id="myForm">
                        <div class="card imgholder">
                            <label for="imgInput" class="upload">
                                <input type="file" name ="" id="imgInput">
                                <i class="bi bi-cloud-upload"></i>
                            </label>
                            <img src="./image/Profile Icon.svg" alt="" id="imgPreview">
                        </div>

                        <div class="inputField">
                            <div>
                                <label for="name" class="form-label">Nombre: </label>
                                <input type="text" name="" id="name" placeholder="Juan Pérez">
                            </div>

                            <div>
                                <label for="age" class="form-label">Edad: </label>
                                <input type="number" name="" id="age" placeholder="35">
                            </div>
                            
                            <div>
                                <label for="city" class="form-label">Ciudad: </label>
                                <input type="text" name="" id="city" placeholder="Mendoza">
                            </div>

                            <div>
                                <label for="email" class="form-label">Email: </label>
                                <input type="email" name="" id="email" placeholder="juanperez@email.com">
                            </div>
                            
                            <div>
                                <label for="phone" class="form-label">Teléfono: </label>
                                <input type="text" name="" id="phone" minlength="10" maxlength="10" placeholder="1234567890">
                            </div>
                            
                            <div>
                                <label for="job" class="form-label">Trabajo: </label>
                                <input type="text" name="" id="job" placeholder="Abogado">
                            </div>

                            <div>
                                <label for="sDate" class="form-label">Fecha de inicio: </label>
                                <input type="date" name="" id="sDate" placeholder="18/12/2022">
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="submit" form ="myForm" class="btn btn-primary">Guardar</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>

    </div>
    
    <div class="modal fade" id="readData">

        <div class="modal-dialog modal-dialog-centered modal-lg">

            <div class="modal-content">
                
                <div class="modal-header">
                    <h4 class="modal-title">Perfil</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                
                <div class="modal-body">
                    
                    <form action="#">
                        <div class="card imgholder">
                            <img src="./image/Profile Icon.svg" alt="" id="showImg">
                        </div>

                        <div class="inputField">
                            <div>
                                <label for="name" class="form-label">Nombre: </label>
                                <input type="text" name="" id="showName" placeholder="Juan Pérez" disabled>
                            </div>

                            <div>
                                <label for="age" class="form-label">Edad: </label>
                                <input type="number" name="" id="showAge" placeholder="35" disabled>
                            </div>
                            
                            <div>
                                <label for="city" class="form-label">Ciudad: </label>
                                <input type="text" name="" id="showCity" placeholder="Mendoza" disabled>
                            </div>

                            <div>
                                <label for="email" class="form-label">Email: </label>
                                <input type="email" name="" id="showEmail" placeholder="juanperez@email.com" disabled>
                            </div>
                            
                            <div>
                                <label for="phone" class="form-label">Teléfono: </label>
                                <input type="text" name="" id="showPhone" minlength="10" maxlength="10" placeholder="1234567890" disabled>
                            </div>
                            
                            <div>
                                <label for="job" class="form-label">Trabajo: </label>
                                <input type="text" name="" id="showJob" placeholder="Abogado" disabled>
                            </div>

                            <div>
                                <label for="sDate" class="form-label">Fecha de inicio: </label>
                                <input type="date" name="" id="showSDate" placeholder="18/12/2022" disabled>
                            </div>
                        </div>
                    </form>

                </div>
            </div>

        </div>

    </div>
    
    
    
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src = "app.js"></script>
  </body>
</html>
