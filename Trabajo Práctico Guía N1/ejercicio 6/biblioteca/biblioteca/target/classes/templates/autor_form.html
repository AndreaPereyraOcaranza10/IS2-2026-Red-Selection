<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nuevo autor')}"></head>

<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>

<main class="app-content">
    <div class="form-card-wrapper">
        <div class="form-card">
            <h1 class="form-card-title">Nuevo autor</h1>
            <p class="form-card-subtitle">Completá el nombre para agregarlo al catálogo</p>

            <div th:if="${exito}!=null" class="alert-custom alert-custom-success">
                <i class="bi bi-check-circle-fill alert-custom-icon"></i>
                <div class="alert-custom-content" th:text="${exito}"></div>
            </div>
            <div th:if="${error}!=null" class="alert-custom alert-custom-danger">
                <i class="bi bi-exclamation-triangle-fill alert-custom-icon"></i>
                <div class="alert-custom-content" th:text="${error}"></div>
            </div>

            <form th:action="@{/autor/registro}" method="POST">
                <div class="mb-3">
                    <label class="form-label-custom">Nombre</label>
                    <input type="text" class="form-control-custom" name="nombre" placeholder="Nombre del autor" required>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn-custom btn-custom-primary flex-fill">
                        <i class="bi bi-check2"></i> Guardar
                    </button>
                    <a th:href="@{/regresoPage}" class="btn-custom btn-custom-light">Volver</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
