<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Editoriales')}"></head>

<body>
<nav th:replace="~{fragments/navbar :: nav}"></nav>

<main class="app-content">
    <div class="page-shell">

        <div class="page-header">
            <div>
                <h1 class="page-title">Editoriales</h1>
                <p class="page-subtitle">Editoriales registradas en la biblioteca</p>
            </div>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/editorial/registrar}" class="btn-custom btn-custom-primary">
                <i class="bi bi-plus-circle"></i> Nueva editorial
            </a>
        </div>

        <div th:if="${exito}!=null" class="alert-custom alert-custom-success">
            <i class="bi bi-check-circle-fill alert-custom-icon"></i>
            <div class="alert-custom-content" th:text="${exito}"></div>
        </div>
        <div th:if="${error}!=null" class="alert-custom alert-custom-danger">
            <i class="bi bi-exclamation-triangle-fill alert-custom-icon"></i>
            <div class="alert-custom-content" th:text="${error}"></div>
        </div>

        <div class="table-card-custom">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Nombre</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="editorial : ${editoriales}">
                    <td th:text="${editorial.id}"></td>
                    <td class="table-user-name" th:text="${editorial.nombre}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a class="table-btn-action" th:href="@{/editorial/modificar/__${editorial.id}__}" title="Modificar">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(editoriales)}">
                    <td colspan="3" class="text-center text-muted py-4">No hay editoriales cargadas todavía.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <a th:href="@{/inicio}" class="btn-custom btn-custom-light">
            <i class="bi bi-arrow-left"></i> Volver
        </a>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
