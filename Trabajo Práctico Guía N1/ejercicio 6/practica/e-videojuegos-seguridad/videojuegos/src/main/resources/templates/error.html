<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: head('Error - RedSelection')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{components/topnav :: topnav}"></nav>

<div id="layoutSidenav">
    <div id="layoutSidenav_nav">
        <nav th:replace="~{components/sidenav :: sidenav}"></nav>
    </div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="alert alert-danger mt-5" role="alert" th:if="${error}">
                            <span th:text="${error}"></span>
                        </div>
                        <div class="alert alert-danger mt-5" role="alert" th:unless="${error}">
                            Ocurrió un error
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{components/footer :: footer}"></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/scripts.js}"></script>
</body>
</html>
