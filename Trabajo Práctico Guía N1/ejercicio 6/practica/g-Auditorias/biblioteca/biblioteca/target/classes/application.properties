spring.application.name=biblioteca
# =============================================================================
# application.properties
# Configuración central de la aplicación Spring Boot.
# Spring Boot lee este archivo al arrancar y auto-configura los "beans"
# necesarios (DataSource, EntityManagerFactory, ViewResolver de Thymeleaf, etc.)
# =============================================================================

# ------------------- Datos del servidor embebido (Tomcat) -------------------
server.port=8080

# ------------------- Conexión a la base de datos MySQL (ORM) -------------------
# URL JDBC: host, puerto y nombre de la base. createDatabaseIfNotExist=true crea
# el esquema automáticamente la primera vez que se ejecuta la aplicación.
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------- Configuración de JPA / Hibernate (ORM) -------------------
# ddl-auto=update: Hibernate compara las @Entity contra las tablas existentes
# y genera/actualiza el esquema automáticamente (ideal para el TP; en un
# ambiente productivo se recomienda usar migraciones versionadas, ej. Flyway).
spring.jpa.hibernate.ddl-auto=update
# Traduce las excepciones de MySQL a excepciones de Spring (DataAccessException)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Muestra por consola el SQL generado por Hibernate (útil para fines didácticos)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evita que se abra una conexión "lazy" fuera de transacción (buena práctica)
spring.jpa.open-in-view=false

# ------------------- Thymeleaf (VISTA) -------------------
# En desarrollo desactivamos el cache de plantillas para ver los cambios al instante
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

