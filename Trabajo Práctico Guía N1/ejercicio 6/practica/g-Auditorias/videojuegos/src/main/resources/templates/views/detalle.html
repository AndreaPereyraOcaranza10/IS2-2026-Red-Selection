<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{components/layout :: head('Detalle - RedSelection')}"></head>

<body class="sb-nav-fixed">

    <nav th:replace="~{components/topnav :: topnav}"></nav>

    <div id="layoutSidenav">

        <div id="layoutSidenav_nav">
            <nav th:replace="~{components/sidenav :: sidenav}"></nav>
        </div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container">
                    <div class="row mt-5" th:object="${videojuego}">
                        <div class="col-4">
                            <img th:src="${#strings.startsWith(videojuego.imagen, 'http')} ? ${videojuego.imagen} : @{'/imagenes/' + ${videojuego.imagen}}" alt="" class="img-fluid rounded detalle-imagen">
                        </div>
                        <div class="col-8">
                            <div class="card shadow-sm border-0 h-100 justify-content-center">
                                <div class="card-body">
                                    <h5 class="card-title fs-3" th:text="*{titulo}">Card title</h5>
                                    <p class="card-text fs-4 text-success fw-bold">$<span th:text="*{precio}">1</span></p>
                                    <p class="card-text" th:if="*{stock}">
                                        <span class="badge bg-secondary">Stock: <span th:text="*{stock}"></span></span>
                                    </p>
                                    <p class="card-text" th:unless="*{stock}">
                                        <span class="badge bg-danger">No hay stock</span>
                                    </p>
                                </div>
                                <hr class="m-0">
                                <div class="card-body">
                                    <p class="card-text" th:text="*{descripcion}"></p>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 mt-5">
                            <a th:href="@{/inicio}" class="btn btn-outline-dark">Volver</a>
                        </div>
                    </div>
                </div>
            </main>

            <footer th:replace="~{components/footer :: footer}"></footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/scripts.js}"></script>

    <style>
        .detalle-imagen {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
    </style>

</body>
</html>
