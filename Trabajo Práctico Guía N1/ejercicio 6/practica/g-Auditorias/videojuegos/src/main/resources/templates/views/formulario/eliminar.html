<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: head('Eliminar Videojuego - RedSelection')}"></head>

<body class="sb-nav-fixed">

    <nav th:replace="~{components/topnav :: topnav}"></nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav th:replace="~{components/sidenav :: sidenav}"></nav>
        </div>
        <div id="layoutSidenav_content">
            <main>

                <div class="container">
                    <div class="row mt-5">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <form th:action="@{/eliminar/videojuego/{id}(id=${videojuego.id})}" method="post">
                                        <div class="row g-3 text-center">
                                            <div class="form-group col-md-12">
                                                <h4>¿Esta seguro de eliminar este videojuego? </h4>
                                            </div>
                                        </div>
                                        <div class="row m-3">
                                            <div class="col-md-6">
                                                <button class="btn btn-outline-secondary" type="submit" style="width:100%">
                                                    Si
                                                </button>
                                            </div>
                                            <div class="col-md-6">
                                                <a class="btn btn-success" th:href="@{/abm}" style="width:100%">No</a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer th:replace="~{components/footer :: footer}"></footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/scripts.js}"></script>

</body>

</html>
