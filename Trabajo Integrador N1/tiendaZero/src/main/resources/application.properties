spring.application.name=tiendaZero
# =========================================
# Conexión a MySQL (Workbench)
# =========================================
# Reemplazá DB_USUARIO y DB_PASSWORD por los datos de tu MySQL local.
# createDatabaseIfNotExist=true crea la base "zero" sola si todavía no existe,
# así no tenés que crearla a mano desde Workbench antes de arrancar.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_zero?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Mendoza
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
# update: crea/actualiza tablas según tus entidades sin borrar datos existentes.
# Útil mientras desarrollás. NUNCA usar "create" o "create-drop" si querés
# conservar los datos entre reinicios de la app.
spring.jpa.hibernate.ddl-auto=update

# Dialecto correcto para que Hibernate genere SQL específico de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Muestra en consola el SQL real que ejecuta Hibernate (muy útil para debuggear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# Servidor
# =========================================
server.port=8080