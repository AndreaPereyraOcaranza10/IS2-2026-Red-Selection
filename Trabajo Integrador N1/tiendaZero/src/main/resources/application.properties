spring.config.import=optional:file:.env[.properties],optional:file:Trabajo Integrador N1/tiendaZero/.env[.properties]
#logging.level.org.springframework.boot.context.config=TRACE
spring.application.name=tiendaZero
# =========================================
# Conexión a MySQL (Workbench)
# =========================================
# Reemplazá DB_USUARIO y DB_PASSWORD por los datos de tu MySQL local.
# createDatabaseIfNotExist=true crea la base "zero" sola si todavía no existe,
# así no tenés que crearla a mano desde Workbench antes de arrancar.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_zero?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Argentina/Mendoza
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
# update: crea/actualiza tablas según tus entidades sin borrar datos existentes.
# Útil mientras desarrollás. NUNCA usar "create" o "create-drop" si querés
# conservar los datos entre reinicios de la app.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL real que ejecuta Hibernate (muy útil para debuggear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Creamos un usuario jefe para poder administrar
app.admin.usuario=admin@tiendazero.com
app.admin.clave=1234

# =========================================
# Envío de correos (registro de clientes)
# =========================================
# Necesitás una "contraseña de aplicación" de Gmail (no tu contraseña normal):
# Cuenta de Google > Seguridad > Verificación en dos pasos > Contraseñas de aplicaciones
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=redselectionis2@gmail.com
# Configurar MAIL_PASSWORD en el entorno; no guardar la contraseña de aplicación en Git.
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=redselectionis2@gmail.com
app.activacion.url=http://localhost:8080/activar-cuenta
app.tienda.url=http://localhost:8080

# =========================================
# Envio periodico de ofertas a clientes
# =========================================
# 10 dias expresados en milisegundos.
app.ofertas.mail.intervalo-ms=864000000
app.ofertas.mail.initial-delay-ms=864000000
app.ofertas.mail.max-productos=6

# =========================================
# Servidor
# =========================================
server.port=8080

# =========================================
# Subida de imágenes de productos (panel admin)
# =========================================
# El límite por defecto de Spring es 1MB, insuficiente para fotos de producto.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
 # Porcentaje automático aplicado cada dos meses. Configurar según el IPC bimestral vigente.
tienda.inflacion.bimestral=0


# =========================================
# Mercado Pago - Checkout Pro (SDK Java)
# =========================================
# NO guardar el Access Token real en Git. Configurarlo como variable de entorno.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
# URL pública de tu tienda. En desarrollo local puede ser http://localhost:8080.
mercadopago.base-url=${MERCADOPAGO_BASE_URL:http://localhost:8080}
# URL pública HTTPS que Mercado Pago usará para Webhooks.
# Ejemplo con túnel: https://xxxx.ngrok-free.app/mercadopago/webhook
mercadopago.webhook-url=${MERCADOPAGO_WEBHOOK_URL:}
# Clave secreta generada en Mercado Pago > Webhooks.
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
