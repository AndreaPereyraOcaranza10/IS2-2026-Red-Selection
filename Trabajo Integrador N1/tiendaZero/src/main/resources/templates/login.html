<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ingresar TiendaZero</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="tarjeta">
    <h1>Ingresa a TiendaZero</h1>

    <p class="mensaje mensaje--error" th:if="${param.error}">
        Usuario, contraseña incorrectos o cuenta todavía no activada
    </p>
    <p class="mensaje mensaje--exito" th:if="${param.logout}">Sesión cerrada correctamente</p>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="username">Correo electrónico</label>
        <input type="email" id="username" name="username" required autofocus/>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required/>

        <button type="submit">Ingresar</button>
    </form>

    <p class="enlace-secundario">¿No tenés cuenta? <a th:href="@{/registro}">Registrate</a></p>
</div>
</body>
</html>
