<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tienda/fragmentos :: head('Ingresar')}"></head>
<body>
<nav th:replace="~{tienda/fragmentos :: barraSuperior}"></nav>
<nav th:replace="~{tienda/fragmentos :: menu}"></nav>

<section class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="zero-tarjeta">
                    <h1 class="h1">Ingresá a Zero</h1>
                    <p class="zero-subtitulo">Con tu correo y tu contraseña</p>

                    <p class="zero-mensaje zero-mensaje--error" th:if="${param.error}">
                        Usuario, contraseña incorrectos o cuenta todavía no activada
                    </p>
                    <p class="zero-mensaje zero-mensaje--exito" th:if="${param.logout}">
                        Sesión cerrada correctamente
                    </p>

                    <!-- Spring Security espera POST a /login con los campos username y password.
                         th:action agrega solo el token CSRF. -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Correo electrónico</label>
                            <input type="email" id="username" name="username" class="form-control" required autofocus/>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control" required/>
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100">Ingresar</button>
                    </form>

                    <p class="zero-enlace">¿No tenés cuenta? <a th:href="@{/registro}">Registrate</a></p>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{tienda/fragmentos :: pie}"></footer>
<th:block th:replace="~{tienda/fragmentos :: scripts}"></th:block>
</body>
</html>
