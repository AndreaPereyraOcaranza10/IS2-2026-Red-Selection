<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <title th:text="'404 Error - InApp Inventory Dashboard'">404 Error - InApp Inventory Dashboard</title>
  <th:block th:replace="~{admin/fragments/fragments :: head-assets}"></th:block>
</head>

<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="" style="max-width: 500px; width: 100%;">
        <div class="text-center">
            <div class="mb-4">
                <a th:href="@{/}" href="index.html" class="d-inline-block mb-4">
                    <img th:src="@{/assets/images/logo-icon.svg}" src="./assets/images/logo-icon.svg" alt="" width="36">
                    <span class="ms-2"><img th:src="@{/assets/images/logo.svg}" src="./assets/images/logo.svg" alt=""></span>

            </div>

            <h1 class="display-1 fw-bold text-primary mb-2">404</h1>
            <h2 class="card-title h4 mb-3">Page Not Found</h2>
            <p class="text-muted mb-4">Sorry, the page you're looking for doesn't exist or has been moved.</p>

            <a th:href="@{/}" href="index.html" class="btn btn-primary">Go to Dashboard</a>
        </div>
    </div>
</div>

  <th:block th:replace="~{admin/fragments/fragments :: scripts}"></th:block>

</html>
