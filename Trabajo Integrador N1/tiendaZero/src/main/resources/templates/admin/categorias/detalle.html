<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragmentos :: head(${categoria.nombre})}"></head>
<body>
<div th:replace="~{admin/fragmentos :: barraLateral('categorias')}"></div>

<div class="main-wrapper">
    <header th:replace="~{admin/fragmentos :: barraSuperior}"></header>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${categoria.nombre}">Ropa</h1>
            <p class="page-subtitle">Subcategorías de esta categoría</p>
        </div>
        <a th:href="@{/admin/categorias}" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left"></i> Volver a categorías
        </a>
    </div>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="row g-4">
        <!-- Listado de subcategorías -->
        <div class="col-lg-8">
            <div class="table-card-custom">
                <div class="table-responsive">
                    <table class="table-custom">
                        <thead>
                        <tr>
                            <th>Subcategoría</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(subcategorias)}">
                            <td colspan="3" class="text-center text-muted-green py-4">Esta categoría todavía no tiene subcategorías</td>
                        </tr>
                        <tr th:each="s : ${subcategorias}">
                            <td th:text="${s.nombre}">Remeras</td>
                            <td>
                                <span th:if="${!s.eliminado}" class="badge-table success">Activa</span>
                                <span th:if="${s.eliminado}" class="badge-table failed">Eliminada</span>
                            </td>
                            <td class="text-end">
                                <div th:if="${!s.eliminado}" class="d-inline-flex gap-2">
                                    <a th:href="@{/admin/categorias/{idC}/subcategorias/{id}/editar(idC=${categoria.id}, id=${s.id})}"
                                       class="table-btn-action" title="Modificar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/admin/categorias/{idC}/subcategorias/{id}/eliminar(idC=${categoria.id}, id=${s.id})}"
                                          method="post" class="d-inline" onsubmit="return confirm('¿Eliminar esta subcategoría?');">
                                        <button type="submit" class="table-btn-action delete border-0" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Alta rápida de subcategoría en la misma página -->
        <div class="col-lg-4">
            <div class="card border-light shadow-sm p-4">
                <h3 class="h5 mb-3">Agregar subcategoría</h3>
                <form th:action="@{/admin/categorias/{id}/subcategorias/nueva(id=${categoria.id})}" method="post">
                    <div class="mb-3">
                        <label for="nombre" class="form-label-custom">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" class="form-control-custom w-100"
                               th:value="${nombreNueva}" placeholder="Ej.: Remeras">
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Agregar</button>
                </form>
            </div>
        </div>
    </div>

    <footer th:replace="~{admin/fragmentos :: pie}"></footer>
</div>
<th:block th:replace="~{admin/fragmentos :: scripts}"></th:block>
</body>
</html>
