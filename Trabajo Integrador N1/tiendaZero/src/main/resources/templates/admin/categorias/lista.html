<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragmentos :: head('Categorías')}"></head>
<body>
<div th:replace="~{admin/fragmentos :: barraLateral('categorias')}"></div>

<div class="main-wrapper">
    <header th:replace="~{admin/fragmentos :: barraSuperior}"></header>

    <div class="page-header">
        <div>
            <h1 class="page-title">Categorías</h1>
            <p class="page-subtitle">Entrá a una categoría para gestionar sus subcategorías</p>
        </div>
        <a th:href="@{/admin/categorias/nueva}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nueva categoría
        </a>
    </div>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="table-card-custom">
        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="3" class="text-center text-muted-green py-4">Todavía no hay categorías cargadas</td>
                </tr>
                <tr th:each="c : ${categorias}">
                    <td>
                        <a th:if="${!c.eliminado}" th:href="@{/admin/categorias/{id}(id=${c.id})}"
                           class="text-decoration-none fw-semibold" style="color: var(--zero-texto);" th:text="${c.nombre}">Ropa</a>
                        <span th:if="${c.eliminado}" th:text="${c.nombre}">Ropa</span>
                    </td>
                    <td>
                        <span th:if="${!c.eliminado}" class="badge-table success">Activa</span>
                        <span th:if="${c.eliminado}" class="badge-table failed">Eliminada</span>
                    </td>
                    <td class="text-end">
                        <div th:if="${!c.eliminado}" class="d-inline-flex gap-2">
                            <a th:href="@{/admin/categorias/{id}(id=${c.id})}" class="table-btn-action" title="Ver subcategorías">
                                <i class="bi bi-diagram-3"></i>
                            </a>
                            <a th:href="@{/admin/categorias/{id}/editar(id=${c.id})}" class="table-btn-action" title="Modificar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/categorias/{id}/eliminar(id=${c.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar esta categoría?');">
                                <button type="submit" class="table-btn-action delete border-0" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer th:replace="~{admin/fragmentos :: pie}"></footer>
</div>
<th:block th:replace="~{admin/fragmentos :: scripts}"></th:block>
</body>
</html>
