<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragmentos :: head('Formas de pago')}"></head>
<body>

<div th:replace="~{admin/fragmentos :: barraLateral('formas-de-pago')}"></div>

<div class="main-wrapper">
    <header th:replace="~{admin/fragmentos :: barraSuperior}"></header>

    <div class="page-header">
        <div>
            <h1 class="page-title">Formas de pago</h1>
            <p class="page-subtitle">Medios de pago disponibles para las facturas</p>
        </div>
        <a th:href="@{/admin/formas-de-pago/nueva}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nueva forma de pago
        </a>
    </div>

    <!-- Mensajes que llegan después de una redirección (flash attributes) -->
    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="table-card-custom">
        <div class="table-responsive">
            <table class="table-custom">
                <thead>
                <tr>
                    <th>Tipo de pago</th>
                    <th>Observación</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(formasDePago)}">
                    <td colspan="4" class="text-center text-muted-green py-4">Todavía no hay formas de pago cargadas</td>
                </tr>
                <tr th:each="f : ${formasDePago}">
                    <td th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(f.tipoPago.name(), '_', ' ')))}">Efectivo</td>
                    <td th:text="${f.observacion != null} ? ${f.observacion} : '—'">—</td>
                    <td>
                        <span th:if="${!f.eliminado}" class="badge-table success">Activa</span>
                        <span th:if="${f.eliminado}" class="badge-table failed">Eliminada</span>
                    </td>
                    <td class="text-end">
                        <div th:if="${!f.eliminado}" class="d-inline-flex gap-2">
                            <a th:href="@{/admin/formas-de-pago/{id}/editar(id=${f.id})}" class="table-btn-action" title="Modificar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/formas-de-pago/{id}/eliminar(id=${f.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar esta forma de pago?');">
                                <button type="submit" class="table-btn-action delete border-0" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer th:replace="~{admin/fragmentos :: pie}"></footer>
</div>

<th:block th:replace="~{admin/fragmentos :: scripts}"></th:block>
</body>
</html>
