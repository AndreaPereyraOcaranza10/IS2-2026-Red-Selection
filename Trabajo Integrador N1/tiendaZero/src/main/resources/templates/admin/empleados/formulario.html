<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Empleado</title>
  <th:block th:replace="~{admin/fragments/fragments :: head-assets}"></th:block>
</head>
<body>
<div th:replace="~{admin/fragments/fragments :: sidebarTopbar(activePage='empleados')}"></div>
<main id="content" class="content py-10">
  <div class="container-fluid">
    <h1 th:text="${empleado != null && empleado.id != null} ? 'Editar empleado' : 'Nuevo empleado'">Empleado</h1>
    <div class="card">
      <div class="card-body">
        <form th:action="${empleado != null && empleado.id != null} ? @{/admin/empleados/{id}/editar(id=${empleado.id})} : @{/admin/empleados/nuevo}"
              method="post">

          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" id="nombre" name="nombre" th:value="${empleado != null ? empleado.nombre : ''}" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label for="apellido" class="form-label">Apellido</label>
              <input type="text" id="apellido" name="apellido" th:value="${empleado != null ? empleado.apellido : ''}" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label for="sexo" class="form-label">Sexo</label>
              <select id="sexo" name="sexo" class="form-select">
                <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}" th:selected="${empleado != null ? empleado.sexo == s : false}"></option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="fechaNacimiento" class="form-label">Fecha Nacimiento (dd-MM-yyyy)</label>
              <input type="text" id="fechaNacimiento" name="fechaNacimiento" th:value="${fechaNacimientoStr != null ? fechaNacimientoStr : ''}" class="form-control" placeholder="dd-MM-yyyy" required>
            </div>
            <div class="col-md-4 mb-3">
              <label for="tipoDocumento" class="form-label">Tipo Documento</label>
              <select id="tipoDocumento" name="tipoDocumento" class="form-select">
                <option th:each="t : ${tiposDocumento}" th:value="${t}" th:text="${t}" th:selected="${empleado != null ? empleado.tipoDocumento == t : false}"></option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label for="numeroDocumento" class="form-label">Número Documento</label>
              <input type="text" id="numeroDocumento" name="numeroDocumento" th:value="${empleado != null ? empleado.numeroDocumento : ''}" class="form-control" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="tipoEmpleado" class="form-label">Tipo de empleado</label>
              <select id="tipoEmpleado" name="tipoEmpleado" class="form-select">
                <option th:each="te : ${tiposEmpleado}" th:value="${te}" th:text="${te}" th:selected="${empleado != null ? empleado.tipoEmpleado == te : false}"></option>
              </select>
            </div>
            <div class="col-md-8 mb-3">
              <label for="empresa" class="form-label">Empresa</label>
              <select id="empresa" name="idEmpresa" class="form-select">
                <option th:each="emp : ${empresas}" th:value="${emp.id}" th:text="${emp.razonSocial}" th:selected="${empleado != null && empleado.empresa != null ? empleado.empresa.id == emp.id : false}"></option>
              </select>
            </div>
          </div>

          <hr/>
          <h5 class="mt-3">Cuenta de usuario (opcional)</h5>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
              <input type="text" id="nombreUsuario" name="nombreUsuario" class="form-control" th:value="${empleado != null && empleado.usuario != null ? empleado.usuario.nombreUsuario : ''}" placeholder="usuario">
            </div>
            <div class="col-md-6 mb-3">
              <label for="clave" class="form-label">Clave</label>
              <input type="password" id="clave" name="clave" class="form-control" placeholder="********">
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/admin/empleados}" class="btn btn-secondary">Cancelar</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</main>
<th:block th:replace="~{admin/fragments/fragments :: scripts}"></th:block>
</body>
</html>
