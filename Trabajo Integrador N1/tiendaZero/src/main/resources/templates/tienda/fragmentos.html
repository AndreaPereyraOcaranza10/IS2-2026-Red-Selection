<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
    Fragmentos comunes de la tienda (plantilla Zay adaptada a Zero).
    Cada página los incluye con th:replace, por ejemplo:
    <head th:replace="~{tienda/fragmentos :: head('Inicio')}"></head>
-->

<!-- HEAD: recibe el título de la página -->
<head th:fragment="head(titulo)">
    <title th:text="${titulo} + ' | Zero'">Zero</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="apple-touch-icon" th:href="@{/tienda/img/apple-icon.png}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/tienda/img/favicon.ico}">

    <!-- El orden importa: el tema va antes que templatemo.css, que usa sus variables -->
    <link rel="stylesheet" th:href="@{/tienda/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/tema/zero-tema.css}">
    <link rel="stylesheet" th:href="@{/tienda/css/templatemo.css}">
    <link rel="stylesheet" th:href="@{/tienda/css/custom.css}">
    <link rel="stylesheet" th:href="@{/tienda/css/fontawesome.min.css}">
</head>

<body>

<!-- BARRA SUPERIOR: contacto y redes (solo en pantallas grandes) -->
<nav th:fragment="barraSuperior" class="navbar navbar-expand-lg bg-dark navbar-light d-none d-lg-block" id="templatemo_nav_top">
    <div class="container text-light">
        <div class="w-100 d-flex justify-content-between">
            <div>
                <i class="fa fa-envelope mx-2"></i>
                <a class="navbar-sm-brand text-light text-decoration-none" href="mailto:redselectionis2@gmail.com">redselectionis2@gmail.com</a>
            </div>
            <div>
                <a class="text-light" href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram fa-sm fa-fw me-2"></i></a>
                <a class="text-light" href="https://fb.com/" target="_blank"><i class="fab fa-facebook-f fa-sm fa-fw"></i></a>
            </div>
        </div>
    </div>
</nav>

<!-- MENÚ PRINCIPAL -->
<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-light shadow">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand text-success logo h1 align-self-center" th:href="@{/}">Zero</a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#templatemo_main_nav"
                aria-controls="templatemo_main_nav" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="align-self-center collapse navbar-collapse flex-fill d-lg-flex justify-content-lg-between" id="templatemo_main_nav">
            <div class="flex-fill">
                <ul class="nav navbar-nav d-flex justify-content-between mx-lg-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/tienda}">Tienda</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/nosotros}">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contacto}">Contacto</a></li>
                </ul>
            </div>

            <div class="navbar align-self-center d-flex">
                <!-- Carrito (se conecta cuando esté la orden de compra) -->
                <a class="nav-icon position-relative text-decoration-none" th:href="@{/carrito}" title="Carrito">
                    <i class="fa fa-fw fa-cart-arrow-down text-dark mr-1"></i>
                </a>

                <!-- Sin sesión: ícono que lleva al login -->
                <a sec:authorize="isAnonymous()" class="nav-icon position-relative text-decoration-none"
                   th:href="@{/login}" title="Ingresar">
                    <i class="fa fa-fw fa-user text-dark mr-3"></i>
                </a>

                <!-- Con sesión: menú desplegable con el correo y cerrar sesión -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <a class="nav-icon text-decoration-none dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false" title="Mi cuenta">
                        <i class="fa fa-fw fa-user text-dark"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><span class="dropdown-item-text small text-muted" sec:authentication="name">correo</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li sec:authorize="hasAnyRole('ADMINISTRATIVO', 'JEFE')">
                            <a class="dropdown-item" th:href="@{/admin}">Administración</a>
                        </li>
                        <li>
                            <!-- El logout es un POST con token CSRF, por eso es un formulario y no un enlace -->
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item">Cerrar sesión</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- PIE DE PÁGINA -->
<footer th:fragment="pie" class="bg-dark" id="tempaltemo_footer">
    <div class="container">
        <div class="row">
            <div class="col-md-4 pt-5">
                <h2 class="h2 border-bottom pb-3 border-light logo" style="color: var(--zero-resaltado);">Zero</h2>
                <ul class="list-unstyled text-light footer-link-list">
                    <li><i class="fas fa-map-marker-alt fa-fw"></i> Mendoza, Argentina</li>
                    <li>
                        <i class="fa fa-envelope fa-fw"></i>
                        <a class="text-decoration-none" href="mailto:redselectionis2@gmail.com">redselectionis2@gmail.com</a>
                    </li>
                </ul>
            </div>
            <div class="col-md-4 pt-5">
                <h2 class="h2 text-light border-bottom pb-3 border-light">Productos</h2>
                <ul class="list-unstyled text-light footer-link-list">
                    <li><a class="text-decoration-none" th:href="@{/tienda}">Ver todo</a></li>
                </ul>
            </div>
            <div class="col-md-4 pt-5">
                <h2 class="h2 text-light border-bottom pb-3 border-light">Información</h2>
                <ul class="list-unstyled text-light footer-link-list">
                    <li><a class="text-decoration-none" th:href="@{/}">Inicio</a></li>
                    <li><a class="text-decoration-none" th:href="@{/nosotros}">Nosotros</a></li>
                    <li><a class="text-decoration-none" th:href="@{/contacto}">Contacto</a></li>
                </ul>
            </div>
        </div>
        <div class="row text-light mb-4">
            <div class="col-12 mb-3">
                <div class="w-100 my-3 border-top border-light"></div>
            </div>
            <div class="col-auto me-auto">
                <ul class="list-inline text-left footer-icons">
                    <li class="list-inline-item border border-light rounded-circle text-center">
                        <a class="text-light text-decoration-none" target="_blank" href="https://www.instagram.com/"><i class="fab fa-instagram fa-lg fa-fw"></i></a>
                    </li>
                    <li class="list-inline-item border border-light rounded-circle text-center">
                        <a class="text-light text-decoration-none" target="_blank" href="https://facebook.com/"><i class="fab fa-facebook-f fa-lg fa-fw"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <div class="w-100 bg-black py-3">
        <div class="container">
            <div class="row pt-2">
                <div class="col-12">
                    <p class="text-left text-light">
                        Copyright &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Zero
                        | Plantilla base: <a rel="sponsored" href="https://templatemo.com" target="_blank">TemplateMo</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</footer>

<!-- SCRIPTS: van al final del body -->
<th:block th:fragment="scripts">
    <script th:src="@{/tienda/js/jquery-1.11.0.min.js}"></script>
    <script th:src="@{/tienda/js/jquery-migrate-1.2.1.min.js}"></script>
    <script th:src="@{/tienda/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/tienda/js/templatemo.js}"></script>
    <script th:src="@{/tienda/js/custom.js}"></script>
</th:block>

</body>
</html>
