<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="'Checkout page'">Checkout page</title>
    <th:block th:replace="~{tienda/fragments/fragments :: head-assets}"></th:block>
</head>

<body>
    <div th:replace="~{tienda/fragments/fragments :: header}"></div>

    <!-- Checkout -->
    <section id="checkout-page" class="bg-white py-16">
        <div class="container mx-auto px-4">
            <h1 class="text-2xl font-semibold mb-8">Checkout</h1>
            <div class="flex flex-col md:flex-row gap-4">
                <!-- Billing and Shipping Details -->
                <div class="md:w-2/3 bg-white rounded-lg shadow-md p-4">
                    <h2 class="text-xl font-semibold mb-4">Billing Details</h2>
                    <!--
                        Binding con th:object: asumimos que el Controller manda un command object,
                        ej: model.addAttribute("billingDetails", new BillingDetails());
                        y el POST llega a un @PostMapping("/checkout") con @ModelAttribute BillingDetails.
                        Si todavía no tenés esa clase, dejá los "name" (ya agregados) y sacá los th:object/th:field.
                    -->
                    <form id="billing-form" th:action="@{/checkout}" th:object="${billingDetails}" method="post">
                        <div class="mb-4">
                            <label for="billing-name" class="mb-4">Full Name</label>
                            <input type="text" id="billing-name" name="fullName" th:field="*{fullName}" class="w-full px-3 mt-2 py-2 border focus:border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-primary" required>
                        </div>
                        <div class="mb-4">
                            <label for="billing-email" class="mb-4">Email</label>
                            <input type="email" id="billing-email" name="email" th:field="*{email}" class="w-full px-3 mt-2 py-2 border focus:border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-primary" required>
                        </div>
                        <div class="mb-4">
                            <label for="billing-address" class="mb-4">Address</label>
                            <input type="text" id="billing-address" name="address" th:field="*{address}" class="w-full px-3 mt-2 py-2 border focus:border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-primary" required>
                        </div>
                        <div class="mb-4">
                            <label for="billing-city" class="mb-4">City</label>
                            <input type="text" id="billing-city" name="city" th:field="*{city}" class="w-full px-3 mt-2 py-2 border focus:border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-primary" required>
                        </div>
                        <div class="mb-4 flex gap-4">
                            <div class="w-1/2">
                                <label for="billing-state" class="mb-4">State</label>
                                <input type="text" id="billing-state" name="state" th:field="*{state}" class="w-full px-3 mt-2 py-2 border focus:border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-primary" required>
                            </div>
                            <div class="w-1/2">
                                <label for="billing-zip" class="mb-4">ZIP Code</label>
                                <input type="text" id="billing-zip" name="zip" th:field="*{zip}" class="w-full px-3 mt-2 py-2 border focus:border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-primary" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="billing-phone" class="mb-4">Phone Number</label>
                            <input type="tel" id="billing-phone" name="phone" th:field="*{phone}" class="w-full px-3 mt-2 py-2 border focus:border-transparent rounded-full focus:outline-none focus:ring-2 focus:ring-primary" required>
                        </div>
                        <div class="mb-4">
                            <label class="mb-4">Ship to a different address?</label>
                            <input type="checkbox" id="different-address" name="shipToDifferentAddress" th:field="*{shipToDifferentAddress}" class="mr-2">
                            <label for="different-address" class="text-gray-700">Yes</label>
                        </div>
                        <button type="submit" class="bg-primary text-white border border-primary hover:bg-transparent hover:text-primary py-2 px-4 rounded-full w-full md:hidden">Proceed to Payment</button>
                    </form>
                </div>
                <!-- Order Summary -->
                <div class="md:w-1/3 bg-white rounded-lg shadow-md p-4">
                    <h2 class="text-xl font-semibold mb-4">Order Summary</h2>
                    <div class="flex justify-between mb-4">
                        <p>Subtotal</p>
                        <p th:text="${'$' + orderSubtotal} ?: '$59.00'">$59.00</p>
                    </div>
                    <div class="flex justify-between mb-4">
                        <p>Shipping</p>
                        <p th:text="${'$' + orderShipping} ?: '$10.00'">$10.00</p>
                    </div>
                    <div class="flex justify-between mb-4">
                        <p class="font-semibold">Total</p>
                        <p class="font-semibold" th:text="${'$' + orderTotal} ?: '$69.00'">$69.00</p>
                    </div>
                    <!-- Este botón manda el <form> de arriba (atributo form="..."); en pantallas chicas
                         también dejamos uno adentro del form (ver arriba, class "md:hidden") -->
                    <button type="submit" form="billing-form" class="bg-primary text-white border border-primary hover:bg-transparent hover:text-primary py-2 px-4 rounded-full w-full">Proceed to Payment</button>
                </div>
            </div>
        </div>
    </section>
    
    <div th:replace="~{tienda/fragments/fragments :: footer}"></div>

    <th:block th:replace="~{tienda/fragments/fragments :: scripts}"></th:block>
</body>

</html>
