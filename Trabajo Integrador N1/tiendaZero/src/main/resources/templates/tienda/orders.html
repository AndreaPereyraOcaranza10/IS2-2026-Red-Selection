<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mis pedidos - Zero</title>
    <th:block th:replace="~{tienda/fragments/fragments :: head-assets}"></th:block>
</head>
<body>
<div th:replace="~{tienda/fragments/fragments :: header}"></div>
<section class="bg-white py-16">
    <div class="container mx-auto px-4 max-w-4xl">
        <h1 class="text-2xl font-semibold mb-6">Mis pedidos</h1>
        <p th:if="${mensajeExito}" class="text-green-700 mb-4" th:text="${mensajeExito}"></p>
        <p th:if="${mensajeError}" class="text-red-600 mb-4" th:text="${mensajeError}"></p>
        <div th:if="${#lists.isEmpty(orders)}" class="py-8">Todavía no realizaste órdenes.</div>
        <article th:each="pedido : ${orders}" class="border rounded-lg p-5 mb-4">
            <div class="flex flex-wrap justify-between gap-2">
                <strong>Orden <span th:text="${pedido.identificadorCompra}">id</span></strong>
                <span class="rounded bg-gray-100 px-3 py-1" th:text="${pedido.estadoOrdenCompra}">PENDIENTE_ENVIO</span>
            </div>
            <p class="mt-2">Fecha: <span th:text="${pedido.fecha}"></span></p>
            <p>Total: $<span th:text="${pedido.total}"></span></p>
            <p>Entrega: <span th:text="${pedido.direccionEntrega}"></span></p>
            <ul class="mt-3 list-disc pl-6">
                <li th:each="detalle : ${pedido.detalles}"><span th:text="${detalle.producto.nombre}"></span> × <span th:text="${detalle.cantidad}"></span> - $<span th:text="${detalle.subtotal}"></span></li>
            </ul>
            <form th:if="${pedido.estadoOrdenCompra.name() == 'PENDIENTE_PAGO' or pedido.estadoOrdenCompra.name() == 'PENDIENTE_ENVIO'}" th:action="@{'/orders/' + ${pedido.id} + '/cancel'}" method="post" class="mt-4">
                <button class="border border-red-600 text-red-600 rounded-full px-4 py-2">Anular compra</button>
            </form>
        </article>
    </div>
</section>
<div th:replace="~{tienda/fragments/fragments :: footer}"></div>
<th:block th:replace="~{tienda/fragments/fragments :: scripts}"></th:block>
</body>
</html>
