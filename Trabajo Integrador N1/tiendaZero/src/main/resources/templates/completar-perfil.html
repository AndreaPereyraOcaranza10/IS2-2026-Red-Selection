<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tienda/fragmentos :: head('Completar perfil')}"></head>
<body>
<nav th:replace="~{tienda/fragmentos :: barraSuperior}"></nav>
<nav th:replace="~{tienda/fragmentos :: menu}"></nav>

<section class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="zero-tarjeta">
                    <h1 class="h1">Completá tu perfil</h1>
                    <p class="zero-subtitulo">Necesitamos estos datos para terminar de crear tu cuenta</p>

                    <p class="zero-mensaje zero-mensaje--error" th:if="${error}" th:text="${error}"></p>

                    <form th:action="@{/completar-perfil}" method="post">
                        <fieldset>
                            <legend>Datos personales</legend>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" id="nombre" name="nombre" class="form-control" required/>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" id="apellido" name="apellido" class="form-control" required/>
                                </div>
                                <div class="col-md-6">
                                    <label for="sexo" class="form-label">Sexo</label>
                                    <select id="sexo" name="sexo" class="form-select" required>
                                        <option value="" disabled selected>Seleccionar</option>
                                        <option value="MASCULINO">Masculino</option>
                                        <option value="FEMENINO">Femenino</option>
                                        <option value="OTRO">Otro</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="form-control" required/>
                                </div>
                                <div class="col-md-6">
                                    <label for="tipoDocumento" class="form-label">Tipo de documento</label>
                                    <select id="tipoDocumento" name="tipoDocumento" class="form-select" required>
                                        <option value="DNI">DNI</option>
                                        <option value="PASAPORTE">Pasaporte</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="numeroDocumento" class="form-label">Número de documento</label>
                                    <input type="text" id="numeroDocumento" name="numeroDocumento" class="form-control" required/>
                                </div>
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label">Número de teléfono</label>
                                    <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="2614567890"/>
                                </div>
                                <div class="col-md-6">
                                    <label for="idNacionalidad" class="form-label">Nacionalidad</label>
                                    <select id="idNacionalidad" name="idNacionalidad" class="form-select" required>
                                        <option value="" disabled selected>Seleccionar</option>
                                        <option th:each="n : ${nacionalidades}" th:value="${n.id}" th:text="${n.nombre}"></option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label for="direccionEstadia" class="form-label">Dirección de estadía</label>
                                    <input type="text" id="direccionEstadia" name="direccionEstadia" class="form-control" required/>
                                </div>
                            </div>
                        </fieldset>

                        <fieldset>
                            <legend>Dirección</legend>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="idProvincia" class="form-label">Provincia</label>
                                    <select id="idProvincia" class="form-select" required>
                                        <option value="" disabled selected>Seleccionar</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="idDepartamento" class="form-label">Departamento</label>
                                    <select id="idDepartamento" class="form-select" required disabled>
                                        <option value="" disabled selected>Elegí una provincia primero</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="idLocalidad" class="form-label">Localidad</label>
                                    <select id="idLocalidad" name="idLocalidad" class="form-select" required disabled>
                                        <option value="" disabled selected>Elegí un departamento primero</option>
                                    </select>
                                </div>
                                <div class="col-md-8">
                                    <label for="calle" class="form-label">Calle</label>
                                    <input type="text" id="calle" name="calle" class="form-control" required/>
                                </div>
                                <div class="col-md-4">
                                    <label for="numeracion" class="form-label">N° de calle</label>
                                    <input type="text" id="numeracion" name="numeracion" class="form-control" required/>
                                </div>
                                <div class="col-md-6">
                                    <label for="manzanaPiso" class="form-label">Manzana / piso</label>
                                    <input type="text" id="manzanaPiso" name="manzanaPiso" class="form-control" placeholder="Manzana A"/>
                                </div>
                                <div class="col-md-6">
                                    <label for="casaDepartamento" class="form-label">N° casa / depto</label>
                                    <input type="text" id="casaDepartamento" name="casaDepartamento" class="form-control" placeholder="123"/>
                                </div>
                                <div class="col-md-6">
                                    <label for="barrio" class="form-label">Barrio</label>
                                    <input type="text" id="barrio" name="barrio" class="form-control"/>
                                </div>
                                <div class="col-md-6">
                                    <label for="referencia" class="form-label">Referencia</label>
                                    <input type="text" id="referencia" name="referencia" class="form-control" placeholder="Portón verde, al lado de la plaza"/>
                                </div>
                            </div>
                        </fieldset>

                        <button type="submit" class="btn btn-success btn-lg w-100">Guardar perfil</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<footer th:replace="~{tienda/fragmentos :: pie}"></footer>
<th:block th:replace="~{tienda/fragmentos :: scripts}"></th:block>

<!-- Carga en cascada de provincia, departamento y localidad (mismo script que antes) -->
<script>
    const selectProvincia = document.getElementById('idProvincia');
    const selectDepartamento = document.getElementById('idDepartamento');
    const selectLocalidad = document.getElementById('idLocalidad');

    function cargarOpciones(select, url, placeholder) {
        select.disabled = true;
        select.innerHTML = `<option value="" disabled selected>Cargando...</option>`;
        fetch(url)
            .then(r => r.json())
            .then(datos => {
                if (datos.length === 0) {
                    select.innerHTML = `<option value="" disabled selected>Sin opciones cargadas</option>`;
                    return;
                }
                select.innerHTML = `<option value="" disabled selected>${placeholder}</option>` +
                    datos.map(d => `<option value="${d.id}">${d.nombre}</option>`).join('');
                select.disabled = false;
            });
    }

    cargarOpciones(selectProvincia, '/api/ubicacion/provincias', 'Seleccionar');

    selectProvincia.addEventListener('change', () => {
        cargarOpciones(selectDepartamento, `/api/ubicacion/departamentos?idProvincia=${selectProvincia.value}`, 'Seleccionar');
        selectLocalidad.disabled = true;
        selectLocalidad.innerHTML = `<option value="" disabled selected>Elegí un departamento primero</option>`;
    });

    selectDepartamento.addEventListener('change', () => {
        cargarOpciones(selectLocalidad, `/api/ubicacion/localidades?idDepartamento=${selectDepartamento.value}`, 'Seleccionar');
    });
</script>
</body>
</html>
