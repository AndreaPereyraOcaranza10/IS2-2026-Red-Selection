<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil - Zero</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="barra-superior">
    <div class="barra-superior__contenido">
        <a class="marca" th:href="@{/}" aria-label="Ir al inicio">
            <img th:src="@{/assets/images/logo-zero-white.png}" alt="Zero">
        </a>
        <div class="acciones-cuenta">
            <a class="volver-tienda" th:href="${perfilEmpleado} ? @{/admin} : @{/}">&larr; <span th:text="${perfilEmpleado} ? 'Volver al panel' : 'Volver a la tienda'">Volver a la tienda</span></a>
            <form class="form-cerrar-sesion" th:action="@{/logout}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="boton-cerrar-sesion" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>
</header>

<main class="contenido-cuenta contenido-cuenta--superior">
<section class="tarjeta tarjeta--ancha">
    <p class="etiqueta">Mi cuenta</p>
    <h1 th:text="${modoEdicion} ? 'Actualizá tu perfil' : 'Completá tu perfil'">Completá tu perfil</h1>
    <p class="subtitulo"
       th:text="${modoEdicion} ? 'Revisá tus datos personales y guardá los cambios que necesites' : 'Necesitamos estos datos para terminar de crear tu cuenta'">
        Necesitamos estos datos para terminar de crear tu cuenta
    </p>

    <p class="mensaje mensaje--error" th:if="${error}" th:text="${error}"></p>

    <form id="perfil-form" th:action="${perfilEmpleado} ? @{/admin/perfil} : @{/completar-perfil}" th:object="${perfil}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <fieldset>
            <legend>Datos personales</legend>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" th:value="*{correo}" disabled aria-describedby="correo-ayuda"/>
            <small id="correo-ayuda" class="ayuda-campo">El correo de acceso no se puede modificar.</small>

            <div class="fila">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" required/>
                </div>
                <div>
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" th:field="*{apellido}" required/>
                </div>
            </div>

            <div class="fila">
                <div>
                    <label for="sexo">Sexo</label>
                    <select id="sexo" th:field="*{sexo}" required>
                        <option value="" disabled>Seleccionar</option>
                        <option value="MASCULINO">Masculino</option>
                        <option value="FEMENINO">Femenino</option>
                        <option value="OTRO">Otro</option>
                    </select>
                </div>
                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" required/>
                </div>
            </div>

            <div class="fila">
                <div>
                    <label for="tipoDocumento">Tipo de documento</label>
                    <select id="tipoDocumento" th:field="*{tipoDocumento}" required>
                        <option value="DNI">DNI</option>
                        <option value="PASAPORTE">Pasaporte</option>
                    </select>
                </div>
                <div>
                    <label for="numeroDocumento">Número de documento</label>
                    <input type="text" id="numeroDocumento" th:field="*{numeroDocumento}" required/>
                </div>
            </div>

            <th:block th:unless="${perfilEmpleado}">
            <label for="telefono">Número de teléfono</label>
            <input type="tel" id="telefono" th:field="*{telefono}" placeholder="11234567"/>

            <label for="idNacionalidad">Nacionalidad</label>
            <select id="idNacionalidad" th:field="*{idNacionalidad}" required>
                <option value="" disabled>Seleccionar</option>
                <option th:each="n : ${nacionalidades}" th:value="${n.id}" th:text="${n.nombre}"></option>
            </select>

            <label for="direccionEstadia">Dirección de estadía</label>
            <input type="text" id="direccionEstadia" th:field="*{direccionEstadia}" required/>
            </th:block>
        </fieldset>

        <fieldset th:unless="${perfilEmpleado}">
            <legend>Dirección</legend>

            <div class="fila">
                <div>
                    <label for="idProvincia">Provincia</label>
                    <select id="idProvincia" name="idProvincia" required>
                        <option value="" disabled selected>Seleccionar</option>
                    </select>
                </div>
                <div>
                    <label for="idDepartamento">Departamento</label>
                    <select id="idDepartamento" name="idDepartamento" required disabled>
                        <option value="" disabled selected>Elegí una provincia primero</option>
                    </select>
                </div>
            </div>

            <label for="idLocalidad">Localidad</label>
            <select id="idLocalidad" th:field="*{idLocalidad}" required disabled>
                <option value="" disabled selected>Elegí un departamento primero</option>
            </select>

            <div class="fila">
                <div>
                    <label for="calle">Calle</label>
                    <input type="text" id="calle" th:field="*{calle}" required/>
                </div>
                <div>
                    <label for="numeracion">N° de calle</label>
                    <input type="text" id="numeracion" th:field="*{numeracion}" required/>
                </div>
            </div>

            <div class="fila">
                <div>
                    <label for="manzanaPiso">Manzana / piso</label>
                    <input type="text" id="manzanaPiso" th:field="*{manzanaPiso}" placeholder="Manzana A"/>
                </div>
                <div>
                    <label for="casaDepartamento">N° casa / depto</label>
                    <input type="text" id="casaDepartamento" th:field="*{casaDepartamento}" placeholder="123"/>
                </div>
            </div>

            <label for="barrio">Barrio</label>
            <input type="text" id="barrio" th:field="*{barrio}" placeholder="Av. Siempre Viva"/>

            <label for="referencia">Referencia</label>
            <input type="text" id="referencia" th:field="*{referencia}" placeholder="Es en muy muy lejano"/>
        </fieldset>

        <button id="guardar-perfil" type="submit" disabled
                th:text="${modoEdicion} ? 'Guardar cambios' : 'Guardar perfil'">Guardar perfil</button>
    </form>
</section>
</main>

<script th:if="${perfilEmpleado}">
    const formulario = document.getElementById('perfil-form');
    const botonGuardar = document.getElementById('guardar-perfil');
    let estadoInicial = Array.from(formulario.elements)
        .filter(campo => campo.name && campo.name !== '_csrf' && !campo.disabled)
        .map(campo => `${campo.name}:${campo.value}`)
        .join('|');

    function actualizarBotonGuardar() {
        const estadoActual = Array.from(formulario.elements)
            .filter(campo => campo.name && campo.name !== '_csrf' && !campo.disabled)
            .map(campo => `${campo.name}:${campo.value}`)
            .join('|');
        botonGuardar.disabled = estadoActual === estadoInicial;
    }

    formulario.addEventListener('input', actualizarBotonGuardar);
    formulario.addEventListener('change', actualizarBotonGuardar);
</script>

<script th:unless="${perfilEmpleado}" th:inline="javascript">
    const selectProvincia = document.getElementById('idProvincia');
    const selectDepartamento = document.getElementById('idDepartamento');
    const selectLocalidad = document.getElementById('idLocalidad');
    const formulario = document.getElementById('perfil-form');
    const botonGuardar = document.getElementById('guardar-perfil');
    const ubicacionInicial = {
        provincia: /*[[${perfil.idProvincia}]]*/ '',
        departamento: /*[[${perfil.idDepartamento}]]*/ '',
        localidad: /*[[${perfil.idLocalidad}]]*/ ''
    };
    let estadoInicial = '';

    function cargarOpciones(select, url, placeholder, seleccionada = '') {
        select.disabled = true;
        select.innerHTML = `<option value="" disabled selected>Cargando...</option>`;
        return fetch(url)
            .then(r => r.json())
            .then(datos => {
                if (datos.length === 0) {
                    select.innerHTML = `<option value="" disabled selected>Sin opciones cargadas</option>`;
                    return;
                }
                select.innerHTML = `<option value="" disabled selected>${placeholder}</option>` +
                    datos.map(d => `<option value="${d.id}">${d.nombre}</option>`).join('');
                select.disabled = false;
                if (seleccionada) {
                    select.value = seleccionada;
                }
            });
    }

    function estadoFormulario() {
        return Array.from(formulario.elements)
            .filter(campo => campo.name && campo.name !== '_csrf' && !campo.disabled)
            .map(campo => `${campo.name}:${campo.value}`)
            .join('|');
    }

    function actualizarBotonGuardar() {
        botonGuardar.disabled = estadoFormulario() === estadoInicial;
    }

    async function cargarUbicacionInicial() {
        await cargarOpciones(selectProvincia, '/api/ubicacion/provincias', 'Seleccionar', ubicacionInicial.provincia);
        if (ubicacionInicial.provincia) {
            await cargarOpciones(selectDepartamento,
                `/api/ubicacion/departamentos?idProvincia=${ubicacionInicial.provincia}`,
                'Seleccionar', ubicacionInicial.departamento);
        }
        if (ubicacionInicial.departamento) {
            await cargarOpciones(selectLocalidad,
                `/api/ubicacion/localidades?idDepartamento=${ubicacionInicial.departamento}`,
                'Seleccionar', ubicacionInicial.localidad);
        }
        estadoInicial = estadoFormulario();
        actualizarBotonGuardar();
    }

    selectProvincia.addEventListener('change', () => {
        cargarOpciones(selectDepartamento, `/api/ubicacion/departamentos?idProvincia=${selectProvincia.value}`, 'Seleccionar');
        selectLocalidad.disabled = true;
        selectLocalidad.innerHTML = `<option value="" disabled selected>Elegí un departamento primero</option>`;
    });

    selectDepartamento.addEventListener('change', () => {
        cargarOpciones(selectLocalidad, `/api/ubicacion/localidades?idDepartamento=${selectDepartamento.value}`, 'Seleccionar');
    });

    formulario.addEventListener('input', actualizarBotonGuardar);
    formulario.addEventListener('change', actualizarBotonGuardar);
    cargarUbicacionInicial();
</script>
</body>
</html>
