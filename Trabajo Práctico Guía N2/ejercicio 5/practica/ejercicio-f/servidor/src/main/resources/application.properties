spring.application.name=ejercicio-c
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/db_maps?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Argentina/Mendoza
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect

#Variable de entorno
server.port=8080

# ---------- SEGURIDAD (JWT) ----------
# Los valores reales viven en el archivo .env (no se sube al repositorio). Ver .env.example
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=60
security.admin.username=admin
security.admin.password=${ADMIN_PASSWORD:}
