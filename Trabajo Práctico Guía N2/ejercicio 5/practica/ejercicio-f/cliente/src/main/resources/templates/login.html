<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<main class="login">
    <h1>Red Selection</h1>

    <div th:if="${param.error}" class="alerta error">Usuario o contraseña incorrectos, o el servidor no responde.</div>
    <div th:if="${param.logout}" class="alerta ok">Cerraste sesión correctamente.</div>
    <div th:if="${param.registrado}" class="alerta ok">Usuario creado. Ya podés ingresar.</div>

    <!-- th:action agrega solo el token CSRF -->
    <form th:action="@{/login}" method="post" class="formulario">
        <fieldset>
            <legend>Ingresar</legend>
            <label>Usuario
                <input type="text" name="username" required autofocus autocomplete="username">
            </label>
            <label>Contraseña
                <input type="password" name="password" required autocomplete="current-password">
            </label>
            <button type="submit">Entrar</button>
        </fieldset>
    </form>

    <p class="ayuda" style="text-align:center">¿No tenés cuenta? <a th:href="@{/registro}">Registrate</a></p>
</main>
</body>
</html>
