<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<main class="login">
    <h1>Crear cuenta</h1>

    <div th:if="${error}" class="alerta error" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post" class="formulario">
        <fieldset>
            <legend>Nuevo usuario</legend>
            <label>Usuario
                <input type="text" name="username" th:value="${username}" required minlength="3" maxlength="50" autofocus autocomplete="username">
            </label>
            <label>Contraseña (mínimo 8 caracteres)
                <input type="password" name="password" required minlength="8" maxlength="100" autocomplete="new-password">
            </label>
            <label>Repetir contraseña
                <input type="password" name="confirmar" required minlength="8" maxlength="100" autocomplete="new-password">
            </label>
            <button type="submit">Registrarme</button>
        </fieldset>
    </form>

    <p class="ayuda" style="text-align:center">¿Ya tenés cuenta? <a th:href="@{/login}">Ingresar</a></p>
</main>
</body>
</html>
