# Un unico emisor de confianza para el cliente y el servidor de recursos.
spring.security.oauth2.client.provider.mascotas.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8081/realms/mascotas}
spring.security.oauth2.client.registration.mascotas.provider=mascotas
spring.security.oauth2.client.registration.mascotas.client-id=${OAUTH2_CLIENT_ID:mascotas-web}
spring.security.oauth2.client.registration.mascotas.client-secret=${OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.mascotas.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.mascotas.scope=openid,profile,email
spring.security.oauth2.client.registration.mascotas.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8081/realms/mascotas}
spring.security.oauth2.resourceserver.jwt.audiences=${OAUTH2_AUDIENCE:mascotas-api}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
