spring.application.name=shopease

#server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/shopease?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Product image uploads (the default per-file limit is 1 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

#Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shopease.platform@gmail.com
spring.mail.password=${MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#JWT

jwt.auth.app=authapp
jwt.auth.secret_key=${JWT_KEY:u3r58934yn8934yt89yn2349t8yn92384tyn82349ty23u3r58934yn8934yt89yn2349t8yn92384tyn82349ty23}
jwt.auth.expires_in=3600

# Google SignIn
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH2_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH2_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile, email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo


#Payment Gateway
stripe.secret=${STRIPE_SECRET:sk_test_dummy}

#FileUpload
file.upload.mode=${FILE_UPLOAD_MODE:local}
file.upload.local-dir=${FILE_UPLOAD_LOCAL_DIR:uploads}
file.upload.cdn-url=${FILE_CDN_URL:http://localhost:8080/uploads}
file.upload.zone=${BUNNY_FILE_ZONE:dummy}
file.upload.api-key=${BUNNY_FILE_UPLOAD_API_KEY:dummy}
file.upload.host-url=${BUNNY_FILE_UPLOAD_HOST_URL:https://dummy.com}
