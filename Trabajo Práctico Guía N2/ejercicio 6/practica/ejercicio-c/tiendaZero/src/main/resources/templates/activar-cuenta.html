<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar cuenta - Zero</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="barra-superior">
    <div class="barra-superior__contenido">
        <a class="marca" th:href="@{/}" aria-label="Ir al inicio">
            <img th:src="@{/assets/images/logo-zero-white.png}" alt="Zero">
        </a>
        <a class="volver-tienda" th:href="@{/}">&larr; Volver a la tienda</a>
    </div>
</header>

<main class="contenido-cuenta">
<section class="tarjeta">
    <p class="etiqueta">Verificación</p>
    <h1>Activá tu cuenta</h1>
    <p class="subtitulo">Ingresá el código que te llegó por mail</p>

    <p class="mensaje mensaje--error" th:if="${error}" th:text="${error}"></p>

    <div th:if="${activada}">
        <p class="mensaje mensaje--exito">¡Listo! Ya podés iniciar sesión y completar tu perfil</p>
        <p class="enlace-secundario"><a th:href="@{/completar-perfil}">Iniciar sesión </a></p>
    </div>

    <form th:unless="${activada}" th:action="@{/activar-cuenta}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" th:value="${correo}" placeholder="nombre@correo.com" autocomplete="email" required autofocus/>

        <label for="codigo">Código recibido por mail</label>
        <input type="text" id="codigo" name="codigo" class="codigo-caja" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required/>

        <button type="submit">Activar</button>
    </form>
</section>
</main>
</body>
</html>
