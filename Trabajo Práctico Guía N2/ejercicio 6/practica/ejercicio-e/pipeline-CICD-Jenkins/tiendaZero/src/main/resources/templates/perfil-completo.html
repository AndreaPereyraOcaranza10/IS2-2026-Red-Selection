<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil completado - Zero</title>
    <link rel="icon" type="image/png" th:href="@{/assets/images/favicon.png}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="barra-superior">
    <div class="barra-superior__contenido">
        <a class="marca" th:href="@{/}" aria-label="Ir al inicio">
            <img th:src="@{/assets/images/logo-zero-white.png}" alt="Zero">
        </a>
        <a class="volver-tienda" th:href="@{/}">&larr; Volver a la tienda</a>
    </div>
</header>

<main class="contenido-cuenta">
<section class="tarjeta">
    <p class="etiqueta">Perfil completado</p>
    <h1>¡Listo!</h1>
    <p class="mensaje mensaje--exito">Tu perfil ya está completo ¡Hora de comprar!</p>
    <div class="acciones-exito">
        <a class="boton" th:href="@{/shop}">Ir a la tienda</a>
    </div>
</section>
</main>
</body>
</html>
