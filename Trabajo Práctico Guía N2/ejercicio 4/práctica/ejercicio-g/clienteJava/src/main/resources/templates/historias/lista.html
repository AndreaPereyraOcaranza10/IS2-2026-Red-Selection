<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Historias clínicas')}"></head>
<body class="starter-page-page">
<header th:replace="~{fragments/layout :: header('historias')}"></header>

<main class="main">
    <div th:replace="~{fragments/layout :: encabezado('Historias clínicas', 'Consultas registradas por paciente')}"></div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <section class="section">
        <div class="container">

            <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
                <form th:action="@{/historias}" method="get" class="d-flex gap-2">
                    <select name="pacienteId" class="form-select">
                        <option value="">Todos los pacientes</option>
                        <option th:each="p : ${pacientes}" th:value="${p.id}"
                                th:selected="${p.id == pacienteSel}"
                                th:text="${p.apellido + ', ' + p.nombre}"></option>
                    </select>
                    <button class="btn btn-outline-primary">Filtrar</button>
                </form>
                <a th:href="@{/historias/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva historia</a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr><th>Paciente</th><th>Documento</th><th>Cargada por</th><th>Consultas</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="h : ${historias}">
                        <td th:text="${h.paciente.apellido + ', ' + h.paciente.nombre}"></td>
                        <td th:text="${h.paciente.documento}"></td>
                        <td th:text="${h.usuario.nombreUsuario}"></td>
                        <td><span class="badge text-bg-secondary" th:text="${#lists.size(h.detalles)}"></span></td>
                        <td class="text-end">
                            <a th:href="@{/historias/{id}(id=${h.id})}" class="btn btn-sm btn-outline-primary">Ver</a>
                            <a th:href="@{/historias/{id}/editar(id=${h.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                            <form th:action="@{/historias/{id}/eliminar(id=${h.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar esta historia clínica?')">
                                <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(historias)}">
                        <td colspan="5" class="text-center text-muted">No hay historias clínicas</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
