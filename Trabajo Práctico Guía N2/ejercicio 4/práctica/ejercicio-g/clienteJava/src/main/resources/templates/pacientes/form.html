<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Paciente')}"></head>
<body class="starter-page-page">
<header th:replace="~{fragments/layout :: header('pacientes')}"></header>

<main class="main">
    <div th:replace="~{fragments/layout :: encabezado('Paciente', 'Completá los datos del paciente')}"></div>

    <section class="section">
        <div class="container" style="max-width:640px">
            <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-control" th:field="*{apellido}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Documento</label>
                    <input type="text" class="form-control" th:field="*{documento}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Foto</label>
                    <div th:if="*{fotoPaciente != null and fotoPaciente.dataUri != null}" class="mb-2">
                        <img th:src="*{fotoPaciente.dataUri}" alt="foto actual" width="96" class="rounded">
                        <div class="form-text">Si no elegís otra, se conserva esta.</div>
                    </div>
                    <input type="file" name="foto" class="form-control" accept="image/*">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/pacientes}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
