<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pacientes')}"></head>
<body class="starter-page-page">
<header th:replace="~{fragments/layout :: header('pacientes')}"></header>

<main class="main">
    <div th:replace="~{fragments/layout :: encabezado('Pacientes', 'Registro de pacientes del consultorio')}"></div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <section class="section">
        <div class="container">
            <div class="d-flex justify-content-end mb-3">
                <a th:href="@{/pacientes/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo paciente</a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Foto</th><th>Nombre</th><th>Apellido</th><th>Documento</th><th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${pacientes}">
                        <td>
                            <img th:if="${p.fotoPaciente != null and p.fotoPaciente.dataUri != null}"
                                 th:src="${p.fotoPaciente.dataUri}" alt="foto"
                                 class="rounded-circle" width="48" height="48" style="object-fit:cover">
                            <i th:unless="${p.fotoPaciente != null and p.fotoPaciente.dataUri != null}"
                               class="bi bi-person-circle fs-2 text-secondary"></i>
                        </td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="${p.apellido}"></td>
                        <td th:text="${p.documento}"></td>
                        <td class="text-end">
                            <a th:href="@{/pacientes/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:action="@{/pacientes/{id}/eliminar(id=${p.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este paciente?')">
                                <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                            <a th:href="@{/historias(pacienteId=${p.id})}" class="btn btn-sm btn-outline-secondary">Historias</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pacientes)}">
                        <td colspan="5" class="text-center text-muted">No hay pacientes cargados</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
