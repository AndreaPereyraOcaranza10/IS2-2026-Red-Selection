# Perfil de producción: SPRING_PROFILES_ACTIVE=prod
# Sin valores por defecto: si falta una variable, la app NO arranca (mejor que arrancar con un secreto de desarrollo).
app.jwt.secret=${JWT_SECRET}
app.cors.origenes=${CORS_ORIGENES}
app.demo-data=false

# No filtrar detalles internos en las respuestas ni en los logs
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jpa.show-sql=false
management.endpoint.health.show-details=never

# En producción la base es MySQL 8 (en desarrollo, MariaDB de XAMPP: ver application.properties).
# No es un secreto, así que tiene valor por defecto; si se usa MariaDB: DB_DIALECT=org.hibernate.dialect.MariaDBDialect
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
