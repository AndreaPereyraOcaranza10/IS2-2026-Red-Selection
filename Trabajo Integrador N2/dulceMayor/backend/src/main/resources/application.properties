spring.application.name=dulceMayor
server.port=${SERVER_PORT:8080}

# Lee el archivo .env (si existe) como fuente de propiedades
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dulce_mayor}?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Mendoza

app.georef.url=https://apis.datos.gob.ar/georef/api

spring.security.user.name=dev
spring.security.user.password=${DEV_API_PASSWORD}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB