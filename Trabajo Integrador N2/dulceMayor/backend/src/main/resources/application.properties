spring.application.name=dulceMayor
server.port=${SERVER_PORT:8080}

# Lee el archivo .env (si existe) como fuente de propiedades
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dulce_mayor}?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Desarrollo: el equipo usa MariaDB (XAMPP). Con el dialecto de MySQL, Hibernate genera "FOR UPDATE OF ..." en los
# bloqueos (productos, pedidos, pagos) y MariaDB lo rechaza. Producción usa MySQL 8 (ver application-prod.properties).
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Mendoza

app.georef.url=https://apis.datos.gob.ar/georef/api

# --- BK-13: proveedor conversacional local (Ollama) ---
app.chatbot.ollama.url=${CHATBOT_OLLAMA_URL:http://127.0.0.1:11434}
app.chatbot.ollama.modelo=${CHATBOT_OLLAMA_MODELO:llama3.1:8b}

app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.username=${ADMIN_BOOTSTRAP_ADMIN_USERNAME:admin@dulcemayor.local}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_ADMIN_PASSWORD:}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# --- Correo (aviso al próximo comercio en el reparto) ---
# Sin estas variables el sistema funciona igual: la entrega se registra y el aviso se omite.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# --- Ruteo por calles (optimizar ruta y "Cómo llegar") ---
# Por defecto usa el servidor público de OSRM (solo desarrollo). En producción, un OSRM propio:
# app.osrm.url=${OSRM_URL:http://osrm:5000}

app.jwt.secret=${JWT_SECRET:dulce-mayor-clave-solo-para-desarrollo-no-usar-en-produccion}
app.jwt.horas-validez=${JWT_HORAS:12}
# Bloqueo de login por intentos fallidos
app.seguridad.max-intentos=${LOGIN_MAX_INTENTOS:5}
app.seguridad.minutos-bloqueo=${LOGIN_MINUTOS_BLOQUEO:15}
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176}
app.demo-data=${DEMO_DATA:true}
app.demo.correo-responsables=${DEMO_CORREO:}
app.auth.auth0.domain=${AUTH0_DOMAIN:}
app.auth.auth0.client-id=${AUTH0_CLIENT_ID:}

# --- BK-12: newsletter mensual ---
app.newsletter.cron=${NEWSLETTER_CRON:0 0 9 5 * *}
app.newsletter.zona=${NEWSLETTER_ZONE:America/Argentina/Mendoza}

#--- BK-14: pasarela de pagos ---
app.pagos.pasarela=${PAGOS_PASARELA:simulada}

# --- BK-15: pasarela de pagos con Mercado Pago ---
app.mp.access-token=${MP_ACCESS_TOKEN:${MERCADOPAGO_ACCESS_TOKEN:}}
app.mp.pos-id=${MP_POS_ID:${MERCADOPAGO_POS_ID:}}
app.mp.webhook-secret=${MP_WEBHOOK_SECRET:${MERCADOPAGO_WEBHOOK_SECRET:}}
app.mp.base-url=${MP_BASE_URL:${MERCADOPAGO_API_URL:https://api.mercadopago.com}}
app.mp.expiracion-qr=${MP_EXPIRACION_QR:${MERCADOPAGO_QR_EXPIRATION:PT15M}}
