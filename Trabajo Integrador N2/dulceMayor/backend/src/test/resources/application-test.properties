# Perfil de los tests de integración (@ActiveProfiles("test")) - BK-14
# Base H2 en memoria: cada corrida arranca VACÍA y no toca la base de desarrollo. No hace falta MySQL ni el .env.
spring.datasource.url=jdbc:h2:mem:dulce_mayor_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Sin servidor de correo real: los envíos fallan sin salir a internet (y eso no rompe nada, ver BK-08)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Los datos de demostración se cargan sobre la base vacía: así también se prueba el seeder
app.demo-data=true
app.jwt.secret=clave-de-prueba-de-al-menos-32-caracteres-para-tests
