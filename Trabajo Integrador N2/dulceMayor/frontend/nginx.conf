server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;   # fotos de productos y sucursales (el backend acepta hasta 2 MB por archivo)

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: se reenvía al backend del docker-compose (misma URL que en desarrollo con el proxy de Vite).
  # El nombre se resuelve en cada pedido (resolver de Docker), así nginx arranca aunque no haya backend
  # (por ejemplo, con docker-compose.frontend.yml y la API simulada).
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # el asistente de presupuestos (Ollama) puede tardar
  }

  # Assets con hash: cache largo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta del router vuelve a index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
